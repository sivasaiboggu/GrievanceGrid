<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <!-- Civic Grid Symbol -->
  <g transform="translate(4, 8)">
    <!-- Base structural tile grid representing public governance and transparency -->
    <rect x="2" y="2" width="20" height="20" rx="3.5" fill="#0F1E36" />
    <rect x="26" y="2" width="20" height="20" rx="3.5" fill="#2563EB" />
    <rect x="2" y="26" width="20" height="20" rx="3.5" fill="#1E40AF" />
    <rect x="26" y="26" width="20" height="20" rx="3.5" fill="#0F1E36" />
    
    <!-- Transparent Civic Verification Grid Node Accent -->
    <circle cx="24" cy="24" r="5" fill="#FFFFFF" stroke="#0F1E36" stroke-width="2.5" />
    <circle cx="24" cy="24" r="2" fill="#2563EB" />
  </g>
  
  <!-- Wordmark Text -->
  <text x="64" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.02em" fill="#0F1E36">GRIEVANCE<tspan fill="#2563EB">GRID</tspan></text>
  <text x="65" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.04em" fill="#64748B">CIVIC RESOLUTION PLATFORM</text>
</svg>
